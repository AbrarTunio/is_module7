<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>User Authentication – Activity Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f7fcf8; --surface:#ffffff; --surface-2:#eef8f1; --border:#d5ebdc; --border-strong:#b4d9c1;
  --text:#14432f; --muted:#557565; --primary:#2e8b57; --primary-dark:#1d6b41; --primary-soft:#e2f4e8;
  --primary-ink:#ffffff; --accent:#93d3ac; --good:#1d6b41; --good-soft:#e3f5ea; --bad:#b8423c; --bad-soft:#fcebe9;
  --warn:#8a5d08; --warn-soft:#fff7e0; --warn-border:#efd99a; --rose:#d2556a; --amber:#e3a33a;
  --topbar:rgba(255,255,255,.9); --shadow:0 1px 2px rgba(20,67,47,.05),0 12px 28px rgba(20,67,47,.07);
  --btn-shadow:0 6px 16px rgba(46,139,87,.22); --token-bg:#1d5c3e; --token-screen:#dcf6e5; --code-bg:#f2f9f4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1a14; --surface:#15241c; --surface-2:#1a2d23; --border:#2a4437; --border-strong:#3b5f4c; --text:#e2f2e8; --muted:#9bbcab;
    --primary:#52c38a; --primary-dark:#86dcae; --primary-soft:#1c3a2b; --primary-ink:#06140d; --accent:#3f8f66; --good:#86dcae; --good-soft:#173628;
    --bad:#f28c82; --bad-soft:#3a1d1b; --warn:#f2c46a; --warn-soft:#33290f; --warn-border:#5c4a1c; --rose:#ef8597; --amber:#f0bd5c;
    --topbar:rgba(21,36,28,.9); --shadow:0 1px 2px rgba(0,0,0,.3); --btn-shadow:none; --token-bg:#0b3a26; --token-screen:#cff1dd; --code-bg:#13201a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1a14; --surface:#15241c; --surface-2:#1a2d23; --border:#2a4437; --border-strong:#3b5f4c; --text:#e2f2e8; --muted:#9bbcab;
  --primary:#52c38a; --primary-dark:#86dcae; --primary-soft:#1c3a2b; --primary-ink:#06140d; --accent:#3f8f66; --good:#86dcae; --good-soft:#173628;
  --bad:#f28c82; --bad-soft:#3a1d1b; --warn:#f2c46a; --warn-soft:#33290f; --warn-border:#5c4a1c; --rose:#ef8597; --amber:#f0bd5c;
  --topbar:rgba(21,36,28,.9); --shadow:0 1px 2px rgba(0,0,0,.3); --btn-shadow:none; --token-bg:#0b3a26; --token-screen:#cff1dd; --code-bg:#13201a;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--text);
  background-image:radial-gradient(900px 420px at 0% -8%,var(--primary-soft),transparent 65%),radial-gradient(700px 360px at 100% 0%,var(--surface-2),transparent 60%);
  background-repeat:no-repeat;
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--topbar);backdrop-filter:blur(10px)}
img,svg{max-width:100%}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.15;margin:0 0 .5em;letter-spacing:-.015em;color:var(--text)}
h1{font-size:clamp(2.1rem,5.5vw,3.4rem);font-weight:800}
h2{font-size:clamp(1.4rem,3.2vw,1.9rem);font-weight:800}
h3{font-size:1.2rem;font-weight:800}
h4{font-size:1.02rem;font-weight:800}
p{margin:0 0 .8em}
b,strong{font-weight:700}
.mono,code{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
code{font-size:.86em;background:var(--code-bg);border:1px solid var(--border);padding:.05em .4em;border-radius:6px;word-break:break-all}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
.wrap{max-width:920px;margin:0 auto;padding:26px 20px 70px}
.small{font-size:.9rem}.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.between{justify-content:space-between}.end{justify-content:flex-end}.center{justify-content:center}
.stack>*+*{margin-top:18px}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--topbar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar-in{max-width:920px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--text);text-align:left}
.brand:disabled{cursor:default}
.brand-ic{width:36px;height:36px;border-radius:11px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-size:18px;flex:none}
.brand-t{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.05rem;line-height:1.1}
.brand-t small{display:block;font-family:"Atkinson Hyperlegible",sans-serif;font-weight:400;font-size:.8rem;color:var(--muted)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tb-prog{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);font-weight:700}
.tb-prog .progress{width:90px}
.student{display:flex;align-items:center;gap:8px;font-size:.88rem;line-height:1.2}
.student small{display:block;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-soft);color:var(--primary-dark);display:grid;place-items:center;font-weight:700;border:1.5px solid var(--accent)}

/* Cards and basics */
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:clamp(18px,3.6vw,32px)}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;font-weight:700;color:var(--primary-dark);background:var(--primary-soft);padding:5px 12px;border-radius:999px}
.lead{font-size:1.12rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--primary-dark)}
.pill.warn{background:var(--warn-soft);border-color:var(--warn-border);color:var(--warn)}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--primary));border-radius:99px;transition:width .45s ease}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 20px;font-size:1rem;font-weight:700;cursor:pointer;background:var(--primary);color:var(--primary-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .2s,box-shadow .2s;box-shadow:var(--btn-shadow);text-decoration:none}
.btn:hover{background:var(--primary-dark)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn-ghost{background:transparent;color:var(--primary-dark);border:1.5px solid var(--border-strong);box-shadow:none}
.btn-ghost:hover{background:var(--primary-soft)}
.btn-soft{background:var(--primary-soft);color:var(--primary-dark);box-shadow:none;border:1px solid var(--border)}
.btn-soft:hover{background:var(--surface-2);border-color:var(--primary)}
.btn-skip{background:var(--surface-2);color:var(--muted);box-shadow:none;border:1px solid var(--border)}
.btn-skip:hover{background:var(--primary-soft);color:var(--primary-dark)}
.btn-sm{padding:8px 14px;font-size:.92rem;border-radius:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field>span{font-weight:700;font-size:.95rem}
.input{font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text);outline:none;transition:border .2s,box-shadow .2s;width:100%}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.input:disabled{background:var(--surface-2);color:var(--muted)}
.input.mono{font-size:.95rem}
.err{color:var(--bad);font-size:.92rem;font-weight:700;min-height:1.3em;margin-top:6px}

/* Welcome */
.hero-grid{display:grid;grid-template-columns:1.25fr .9fr;gap:24px;align-items:center}
.hero-facts{list-style:none;padding:0;margin:16px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero-facts li{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-size:.95rem}
.keyring{position:relative;height:290px}
.keyring svg.shield{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:150px}
.ktag{position:absolute;background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:8px 12px;font-weight:700;box-shadow:var(--shadow);font-size:.95rem;white-space:nowrap}
.ktag small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.kt1{left:2%;top:4%;transform:rotate(-6deg)}.kt2{right:0;top:12%;transform:rotate(5deg)}.kt3{left:0;bottom:6%;transform:rotate(4deg)}.kt4{right:4%;bottom:0;transform:rotate(-4deg)}
.who-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end}

/* Overview */
.objectives{margin:0;padding-left:1.3em;display:grid;gap:6px}
.objectives li::marker{color:var(--primary);font-weight:700}
.journey{display:grid;gap:12px}
.jcard{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;border:1.5px solid var(--border);border-radius:16px;padding:16px;background:var(--surface)}
.jcard.locked{opacity:.65}
.jcard.quiz{border-color:var(--accent);background:var(--surface-2)}
.jnum{width:46px;height:46px;border-radius:14px;background:var(--primary-soft);color:var(--primary-dark);display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.3rem;border:1.5px solid var(--accent)}
.jtitle{font-weight:700;font-size:1.05rem}
.jmeta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.marks{width:100%;border-collapse:collapse;font-size:.96rem}
.marks th,.marks td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left}
.marks th{background:var(--surface-2);font-weight:700}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.howto div{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:12px}
.howto .ic{font-size:1.5rem;display:block}

/* Step */
.crumbs{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.95rem;margin-bottom:10px}
.step-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-tag{display:inline-flex;align-items:center;gap:8px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.05rem;margin-bottom:12px;color:var(--primary-dark)}
.key{background:var(--primary-soft);border-left:5px solid var(--primary);padding:14px 16px;border-radius:12px;margin-top:14px}
.analogy{background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:12px;padding:12px 14px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.mini{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:14px}
.mini-h{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;margin-bottom:4px;color:var(--primary-dark)}
.activity{border:2px solid var(--accent);background:linear-gradient(180deg,var(--surface-2),var(--surface) 160px)}
.act-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.done-badge{display:none;align-items:center;gap:6px;background:var(--primary);color:var(--primary-ink);font-weight:700;font-size:.88rem;padding:4px 12px;border-radius:999px}
.activity.is-done .done-badge{display:inline-flex}
.task-text{font-weight:700;font-size:1.02rem}
.hint-area{margin-top:16px;border-top:1px dashed var(--border-strong);padding-top:14px}
.hint-btn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-border);box-shadow:none}
.hint-btn:hover{background:var(--warn-soft);border-color:var(--warn)}
.hintbox{background:var(--warn-soft);border:1px solid var(--warn-border);padding:10px 14px;border-radius:12px;margin-top:10px;animation:pop .25s}
.feedback{padding:12px 14px;border-radius:12px;margin-top:12px;border-left:5px solid var(--border-strong);background:var(--surface-2);animation:pop .25s}
.feedback.good{background:var(--good-soft);border-left-color:var(--primary)}
.feedback.bad{background:var(--bad-soft);border-left-color:var(--bad)}
.fb-actions{margin-top:10px}
.stepnav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:10px;height:10px;border-radius:99px;background:var(--border-strong);transition:.3s}
.dots i.ok{background:var(--accent)}
.dots i.on{width:28px;background:var(--primary)}
.part{margin:18px 0 8px;color:var(--primary-dark)}
.part:first-child{margin-top:0}
.warnline{background:var(--warn-soft);border:1px solid var(--warn-border);border-radius:10px;padding:8px 12px;font-size:.92rem;margin-bottom:12px}

/* Choice quiz */
.cq-top{display:flex;align-items:center;gap:12px}
.cq-bar{flex:1;height:6px;background:var(--border);border-radius:99px;overflow:hidden}
.cq-bar i{display:block;height:100%;background:var(--primary);transition:width .3s}
.cq-q{font-size:1.06rem;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:12px}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.opt{font-size:1rem;font-weight:700;padding:12px 16px;border-radius:12px;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;transition:background .15s,border-color .15s;text-align:left;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--primary);background:var(--primary-soft)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-soft);border-color:var(--primary);color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}

/* Roles / phases */
.phases{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;margin:12px 0}
.phase{flex:1 1 150px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center}
.phase b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.05rem}
.phase-arrow{align-self:center;color:var(--primary);font-weight:700}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.role{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:.93rem}
.role b{display:block;color:var(--primary-dark)}
.order-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sub{font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.events{display:grid;gap:8px}
.event{width:100%;font-weight:400}
.timeline{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.tl-empty{border:1.5px dashed var(--border-strong);border-radius:12px;padding:14px;color:var(--muted);text-align:center}
.tl-item{display:flex;gap:12px;align-items:flex-start;background:var(--good-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;animation:pop .3s}
.tl-num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:700}
.tl-phase{font-size:.82rem;font-weight:700;color:var(--primary-dark)}

/* Flip cards */
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.flip{perspective:900px;height:230px;cursor:pointer;border:0;background:none;padding:0;color:inherit;text-align:left}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:16px;border:2px solid var(--border-strong);display:flex;flex-direction:column}
.front{background:var(--surface);align-items:center;justify-content:center;text-align:center;gap:2px}
.flip:hover .front{border-color:var(--primary)}
.back{background:var(--primary-soft);border-color:var(--accent);transform:rotateY(180deg);font-size:.93rem;overflow:auto;gap:6px}
.big-emoji{font-size:46px;line-height:1.1}
.f-big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.6rem;color:var(--primary-dark)}
.f-type{font-weight:700;color:var(--primary-dark)}
.weak{margin-top:auto;background:var(--surface);border-radius:10px;padding:6px 8px;font-size:.86rem}

/* Sorting */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:12px;border-radius:14px;background:var(--surface);border:1.5px dashed var(--border-strong)}
.chip{font-size:.95rem;font-weight:700;padding:8px 14px;border-radius:999px;border:1.5px solid var(--border-strong);background:var(--surface-2);color:var(--text);cursor:pointer;transition:transform .15s,background .15s}
.chip:hover{border-color:var(--primary)}
.chip.sel{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--btn-shadow)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:14px}
.bucket{text-align:left;cursor:pointer;border-radius:14px;border:2px solid var(--border-strong);background:var(--surface);padding:12px;min-height:140px;color:var(--text);display:flex;flex-direction:column;gap:6px;transition:border-color .15s,background .15s}
.bucket:hover{border-color:var(--primary);background:var(--surface-2)}
.bh{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.05rem}
.placedlist{display:flex;flex-wrap:wrap;gap:5px}
.placed{font-size:.82rem;background:var(--good-soft);border:1px solid var(--accent);border-radius:8px;padding:2px 8px;color:var(--good);font-weight:700}

/* Hash and salt */
.hashout{font-family:"JetBrains Mono",monospace;font-size:.84rem;word-break:break-all;background:var(--code-bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-height:46px;margin-top:8px}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.flow .box{background:var(--surface);border:1.5px solid var(--border-strong);border-radius:10px;padding:6px 10px;font-weight:700}
.flow .box.fn{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
table.file{width:100%;border-collapse:collapse;font-size:.9rem}
table.file th,table.file td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
table.file tr:last-child td{border-bottom:0}
table.file th{background:var(--surface-2);font-weight:700}
td.dup{background:var(--bad-soft);color:var(--bad);font-weight:700}
td.uniq{background:var(--good-soft);color:var(--good)}
.login-row{display:grid;grid-template-columns:.7fr 1.3fr auto;gap:8px;margin-top:12px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:4px;gap:4px}
.seg button{font-size:.95rem;font-weight:700;border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--primary-dark);box-shadow:var(--shadow)}

/* Tasks / meter / stats */
.tasks{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.task{display:flex;gap:10px;align-items:center;font-weight:700;color:var(--muted)}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--border-strong);display:grid;place-items:center;font-size:.8rem;flex:none;color:transparent;transition:.25s}
.task.ok{color:var(--good)}
.task.ok .tick{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.meter{height:14px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;width:0;transition:width .3s,background .3s}
.verdict{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.15rem;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.stat .k{font-size:.84rem;color:var(--muted);font-weight:700}
.stat .v{font-weight:700;font-size:1.08rem}
.reveals{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.reveal{text-align:left;cursor:pointer;border-radius:14px;border:1.5px dashed var(--border-strong);background:var(--surface);padding:14px;color:var(--text);min-height:92px;font-size:.96rem}
.reveal:hover{border-color:var(--primary)}
.reveal.on{border-style:solid;border-color:var(--accent);background:var(--good-soft);cursor:default}

/* OTP */
.otp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.token{background:var(--token-bg);border-radius:24px;padding:22px;color:#eafff2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),var(--shadow)}
.token-brand{font-weight:700;letter-spacing:.02em}
.token-screen{background:var(--token-screen);color:#0d3b27;font-family:"JetBrains Mono",monospace;font-size:2.1rem;font-weight:600;letter-spacing:.12em;padding:12px 18px;border-radius:12px;width:100%;text-align:center}
.token-bar{width:100%;height:8px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.token-bar i{display:block;height:100%;background:#9cf0bf;transition:width 1s linear}
.token-t{font-size:.9rem;color:#cdeedb}
.portal{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.portal-h{font-family:"Bricolage Grotesque",sans-serif;font-weight:800}

/* Threshold chart */
.chartbox{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px;overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:480px;height:auto}
.c-imp{fill:none;stroke:var(--rose);stroke-width:3}
.c-gen{fill:none;stroke:var(--primary);stroke-width:3}
.s-imp{fill:var(--rose);fill-opacity:.28}
.s-gen{fill:var(--amber);fill-opacity:.35}
.axis{stroke:var(--border-strong);stroke-width:2}
.thr{stroke:var(--text);stroke-width:2;stroke-dasharray:6 4}
.lbl{fill:var(--muted);font-size:13px;font-family:"Atkinson Hyperlegible",sans-serif}
.lbl.strong{fill:var(--text);font-weight:700}
input[type=range]{width:100%;accent-color:var(--primary);height:28px}
.rate.fm{border-left:5px solid var(--rose)}
.rate.fnm{border-left:5px solid var(--amber)}

/* Challenge-response */
.seq-head{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-weight:700;text-align:center;margin:12px 0 8px}
.seq-head div{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:8px}
.seq{display:flex;flex-direction:column;gap:8px}
.msg{display:flex;flex-direction:column;gap:3px;padding:10px 14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--border);animation:slide .35s}
.msg .dir{font-size:.86rem;font-weight:700;color:var(--muted)}
.msg .pay{font-family:"JetBrains Mono",monospace;font-size:.84rem;word-break:break-all}
.msg .note{font-size:.92rem}
.msg.to-server{margin-right:16%}
.msg.to-client{margin-left:16%}
.msg.calc{margin:0 8%;background:var(--surface-2);border-style:dashed}
.msg.ok{background:var(--good-soft);border-color:var(--primary)}
.msg.bad{background:var(--bad-soft);border-color:var(--bad)}
.msg.eve{border-color:var(--rose)}
.store{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.threats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.threats div{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:.92rem}
.threats b{display:block;color:var(--primary-dark)}

/* Module done */
.done-card{text-align:center}
.medal{font-size:64px;line-height:1}
.takeaways{text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:16px 20px;margin:18px auto;max-width:620px}
.takeaways ul{margin:0;padding-left:1.2em;display:grid;gap:6px}

/* Quiz */
.qprompt{font-size:1.25rem;margin:14px 0}
.qopts{display:flex;flex-direction:column;gap:10px}
.qopt{display:flex;gap:12px;align-items:center;text-align:left;font-size:1rem;padding:12px 14px;border-radius:14px;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;transition:background .15s,border-color .15s}
.qopt:hover:not(:disabled){border-color:var(--primary);background:var(--surface-2)}
.qopt:disabled{cursor:default}
.letter{width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;flex:none;border:1px solid var(--border)}
.qopt.sel{border-color:var(--primary);background:var(--primary-soft)}
.qopt.sel .letter{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.qopt.right{border-color:var(--primary);background:var(--good-soft)}
.qopt.right .letter{background:var(--primary);color:var(--primary-ink)}
.qopt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.qopt.wrong .letter{background:var(--bad);color:#fff}

/* Result */
.cert{border:2px solid var(--accent)}
.result-grid{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;margin-top:12px}
.ring{width:170px;height:170px;border-radius:50%;background:conic-gradient(var(--primary) calc(var(--p) * 1%),var(--surface-2) 0);display:grid;place-items:center;border:1px solid var(--border)}
.ring>div{width:132px;height:132px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1}
.ring b{font-family:"Bricolage Grotesque",sans-serif;font-size:2.8rem;font-weight:800;color:var(--primary-dark)}
.ring span{display:block;color:var(--muted);font-size:1rem;margin-top:4px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kv div{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:8px 12px}
.kv small{display:block;color:var(--muted);font-size:.84rem}
.kv b{font-size:1.02rem;word-break:break-word}
.status-pass{color:var(--good)}.status-fail{color:var(--bad)}
.review{margin:0;padding-left:1.3em;display:grid;gap:12px}
.review li{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.review .yes{color:var(--good);font-weight:700}.review .no{color:var(--bad);font-weight:700}
textarea.copybox{width:100%;min-height:150px;font-family:"JetBrains Mono",monospace;font-size:.85rem;border-radius:12px;border:1.5px solid var(--border-strong);padding:10px;background:var(--surface);color:var(--text);margin-top:10px}
.foot{text-align:center;color:var(--muted);font-size:.86rem;padding:0 20px 30px}

/* Motion */
@keyframes pop{from{transform:scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes slide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .4s}
.screen{animation:slide .35s ease}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(106vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.flip-in{transition:none!important}}

/* Responsive */
@media (max-width:760px){
  .hero-grid,.who-grid,.order-grid,.two-col,.result-grid{grid-template-columns:1fr}
  .keyring{height:230px}
  .hero-facts{grid-template-columns:1fr}
  .jcard{grid-template-columns:auto 1fr}
  .jcard .btn{grid-column:1/-1}
  .login-row{grid-template-columns:1fr}
  .msg.to-server{margin-right:6%}.msg.to-client{margin-left:6%}.msg.calc{margin:0 3%}
  .ring{margin:0 auto}
  .tb-prog{display:none}
}

<body>
<header class="topbar" id="topbar"></header>
<main id="app" class="wrap"></main>
<footer class="foot">Progress is saved in this browser only. On a shared lab computer, choose “I’m a different student” before starting.</footer>

<script>
(function(){
"use strict";

/* ---------- Basics ---------- */
const KEY = "ua-activity-lab-v1";
const TOTAL = 15;
const app = document.getElementById("app");
const topbar = document.getElementById("topbar");
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function fresh(){ return { name:"", roll:"", maxPos:-1, done:{}, results:[] }; }
let S = fresh();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const v = localStorage.getItem(KEY); if(v){ const o = JSON.parse(v); if(o && typeof o === "object") S = Object.assign(fresh(), o); } }catch(e){} }

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function shake(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function doneCount(){ return Object.keys(S.done).filter(k => S.done[k]).length; }
function rhex(n){ const b=new Uint8Array(Math.ceil(n/2)); try{ crypto.getRandomValues(b); }catch(e){ for(let i=0;i<b.length;i++) b[i]=Math.floor(Math.random()*256); } return Array.from(b).map(x=>x.toString(16).padStart(2,"0")).join("").slice(0,n); }
let cleanups = [];
function cleanup(){ cleanups.forEach(f => { try{ f(); }catch(e){} }); cleanups = []; }
let mode = "welcome";

async function sha256(str){
  try{
    if(window.crypto && crypto.subtle){
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
    }
  }catch(e){}
  let out = "";
  for(let k=0;k<8;k++){ let h = (0x811c9dc5 ^ (k*2654435761))>>>0; for(const ch of (str+"#"+k)){ h ^= ch.charCodeAt(0); h = Math.imul(h,16777619)>>>0; } out += h.toString(16).padStart(8,"0"); }
  return out;
}

function confetti(){
  if(reduceMotion) return;
  const cols = ["#2e8b57","#93d3ac","#f2c46a","#7fd6c2","#d2556a"];
  const box = document.createElement("div"); box.className = "confetti";
  for(let i=0;i<70;i++){
    const p = document.createElement("i");
    p.style.left = (Math.random()*100) + "vw";
    p.style.background = cols[i % cols.length];
    p.style.animationDelay = (Math.random()*0.7) + "s";
    p.style.animationDuration = (2 + Math.random()*1.6) + "s";
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 4500);
}

/* ---------- Generic choice activity ---------- */
function choiceQuiz(root, cfg){
  const items = cfg.items; let i = 0, first = 0, missed = false;
  const wrap = document.createElement("div"); root.appendChild(wrap);
  function show(){
    if(i >= items.length){
      wrap.innerHTML = `<div class="feedback good">🎉 All ${items.length} done! Correct on the first try: <b>${first} of ${items.length}</b></div>`;
      if(cfg.onDone) cfg.onDone();
      return;
    }
    const it = items[i]; missed = false;
    let opts = (it.opts || cfg.options).slice(); if(cfg.shuffle) opts = shuffle(opts);
    wrap.innerHTML = `<div class="cq-top"><span class="pill">${i+1} of ${items.length}</span><span class="cq-bar"><i style="width:${i/items.length*100}%"></i></span></div>
      <div class="cq-q">${it.q}</div>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}</div>
      <div class="cq-fb" aria-live="polite"></div>`;
    const fb = wrap.querySelector(".cq-fb");
    wrap.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      const o = opts[+b.dataset.k];
      if(o === it.a){
        if(!missed) first++;
        wrap.querySelectorAll(".opt").forEach(x => x.disabled = true);
        b.classList.add("right");
        fb.innerHTML = `<div class="feedback good"><b>Correct!</b> ${it.why}<div class="fb-actions"><button class="btn btn-sm">${i+1 < items.length ? "Next one" : "Finish"}</button></div></div>`;
        fb.querySelector("button").addEventListener("click", () => { i++; show(); });
      } else {
        missed = true; b.classList.add("wrong"); b.disabled = true; shake(b);
        fb.innerHTML = `<div class="feedback bad"><b>Not quite.</b> ${it.hint || cfg.hint || "Read it again and try another option."}</div>`;
      }
    }));
  }
  show();
}

/* ---------- Content data ---------- */
const FACTORS = [
  {id:"know", e:"🧠", k:"Know", short:"lives in your head", ex:"password, PIN, answer to a secret question", type:"Knowledge factor", weak:"Can be guessed, stolen, shared or forgotten.", tip:"This is something you remember in your head."},
  {id:"have", e:"💳", k:"Have", short:"sits in your pocket", ex:"smart card, ATM card, physical key, phone that receives an OTP", type:"Called a token", weak:"Can be lost, stolen or copied, and costs money.", tip:"This is a physical object you carry."},
  {id:"are",  e:"👁️", k:"Are",  short:"is part of your body", ex:"fingerprint, face, retina, iris", type:"Static biometrics (your body)", weak:"Readings have errors, and you can’t change your fingerprint if it leaks.", tip:"This is part of your body that stays the same."},
  {id:"do",   e:"✍️", k:"Do",   short:"is how you behave", ex:"voice pattern, handwriting and signature, typing rhythm", type:"Dynamic biometrics (your behaviour)", weak:"Changes with mood, health or a sore throat.", tip:"This is something you perform: a behaviour."}
];
const FK = {know:"Know", have:"Have", are:"Are", do:"Do"};

const SORT_ITEMS = [
  {t:"PIN code", f:"know"}, {t:"Answer to “Name of your first school?”", f:"know"}, {t:"Password", f:"know"},
  {t:"ATM card", f:"have"}, {t:"Phone receiving an OTP", f:"have"}, {t:"University smart ID card", f:"have"},
  {t:"Fingerprint", f:"are"}, {t:"Face", f:"are"}, {t:"Iris pattern", f:"are"},
  {t:"Voice pattern", f:"do"}, {t:"Handwritten signature", f:"do"}, {t:"Typing rhythm", f:"do"}
];

const NIST_EVENTS = [
  {t:"An <b>Applicant</b> asks for an account, like a new student at admission.", phase:"Registration", clue:"the story starts with someone <b>asking</b> for an account."},
  {t:"The <b>Registration Authority</b> checks their identity documents (CNIC, admission letter).", phase:"Registration", clue:"before anything is issued, someone must <b>check identity documents</b>."},
  {t:"The <b>Credential Service Provider</b> issues a credential: a username with a password, or a smart card.", phase:"Credential", clue:"identity is checked, so who <b>issues</b> the credential?"},
  {t:"The person is now a <b>Subscriber</b>: their identity is bound to that credential.", phase:"Credential", clue:"after receiving a credential, what is the person called?"},
  {t:"Later, as a <b>Claimant</b>, they log in and prove their identity to a <b>Verifier</b>.", phase:"Authentication", clue:"time passes and now the person wants to <b>log in</b>."},
  {t:"The Verifier tells the <b>Relying Party</b> (the portal) the user is genuine, so access is granted.", phase:"Authentication", clue:"who finally <b>grants access</b> based on the verifier’s answer?"}
];

const ATTACK = {
  off:"Offline dictionary attack", spec:"Specific account attack", pop:"Popular password attack", single:"Guessing against a single user",
  hij:"Workstation hijacking", mist:"Exploiting user mistakes", multi:"Exploiting multiple password use", mon:"Electronic monitoring"
};

const COMMON = ["123456","password","12345678","qwerty","123456789","12345","111111","1234567","iloveyou","admin","welcome","abc123","password1","password123","pakistan","pakistan123","letmein","000000","qwerty123","1q2w3e4r","123123","654321"];
const WORDS = ["password","pakistan","football","iloveyou","hyderabad","karachi","welcome","cricket","student","monkey","dragon","qwerty","mehran","admin","sindh","love"].sort((a,b)=>b.length-a.length);

/* ---------- Activities ---------- */
function act_idVerify(root, api){
  const I = "Identification", V = "Verification";
  choiceQuiz(root, {
    options:[I, V],
    hint:"Ask yourself: is this just a <b>claim</b> anyone could make, or real <b>evidence</b>?",
    items:[
      {q:"You type <b>sana.khan@uni.edu.pk</b> into the email box on the login page.", a:I, why:"Typing an email only <i>claims</i> an identity. Anyone could type it."},
      {q:"You type the password for that account.", a:V, why:"The password is evidence that backs up your claim."},
      {q:"You tell the lab attendant, “I am roll number 23CS045.”", a:I, why:"Saying a roll number is a claim. Nothing has been proven yet."},
      {q:"You enter the 6-digit code that was just sent to your phone.", a:V, why:"Only the person holding your phone should be able to see that code."},
      {q:"Your phone unlocks after scanning your face.", a:V, why:"Your face is compared with the stored template of the phone’s owner. That is proof."},
      {q:"You pick your name from a drop-down list on the attendance portal.", a:I, why:"Choosing a name is still just a claim."}
    ],
    onDone: api.complete
  });
}

function act_nistOrder(root, api){
  let next = 0;
  const order = shuffle(NIST_EVENTS.map((e,i)=>i));
  root.innerHTML = `<div class="order-grid">
    <div><div class="sub">Events (shuffled)</div><div class="events" id="evs"></div></div>
    <div><div class="sub">Your timeline</div><ol class="timeline" id="tl"><li class="tl-empty">Click the event that happens first</li></ol></div>
  </div><div id="ofb" aria-live="polite"></div>`;
  const evs = root.querySelector("#evs"), tl = root.querySelector("#tl"), fb = root.querySelector("#ofb");
  order.forEach(i => {
    const b = el(`<button class="opt event">${NIST_EVENTS[i].t}</button>`);
    b.addEventListener("click", () => {
      if(i === next){
        b.remove();
        if(next === 0) tl.innerHTML = "";
        tl.appendChild(el(`<li class="tl-item"><span class="tl-num">${next+1}</span><div><div class="tl-phase">${NIST_EVENTS[i].phase} phase</div>${NIST_EVENTS[i].t}</div></li>`));
        next++;
        if(next === NIST_EVENTS.length){
          fb.innerHTML = `<div class="feedback good">🎉 Perfect order! Registration, then credential, then authentication. Notice the same person was called Applicant, Subscriber and Claimant along the way.</div>`;
          api.complete();
        } else {
          fb.innerHTML = `<div class="feedback good">✓ Correct. What happens next?</div>`;
        }
      } else {
        shake(b);
        fb.innerHTML = `<div class="feedback bad">Not yet. Hint: ${NIST_EVENTS[next].clue}</div>`;
      }
    });
    evs.appendChild(b);
  });
}

function act_flip(root, api){
  const seen = new Set();
  root.innerHTML = `<div class="flips">${FACTORS.map((f,i)=>`
    <button class="flip" data-i="${i}" aria-label="Flip the card: something you ${f.k.toLowerCase()}">
      <div class="flip-in">
        <div class="face front"><div class="big-emoji">${f.e}</div><div class="muted">Something you</div><div class="f-big">${f.k}</div><div class="small muted">Tap to flip</div></div>
        <div class="face back"><span class="f-type">${f.e} ${f.type}</span><span><b>Examples:</b> ${f.ex}</span><div class="weak">⚠️ ${f.weak}</div></div>
      </div>
    </button>`).join("")}</div><div id="ffb" aria-live="polite"></div>`;
  const fb = root.querySelector("#ffb");
  root.querySelectorAll(".flip").forEach(b => b.addEventListener("click", () => {
    b.classList.toggle("on"); seen.add(b.dataset.i);
    if(seen.size === 4){
      fb.innerHTML = `<div class="feedback good">🎉 You’ve met all four factors: <b>Know, Have, Are, Do</b>. Are and Do are both biometrics: Are is your body, Do is your behaviour.</div>`;
      api.complete();
    } else {
      fb.innerHTML = `<div class="feedback">${seen.size} of 4 cards flipped.</div>`;
    }
  }));
}

function act_sort(root, api){
  const items = shuffle(SORT_ITEMS); let sel = null, placed = 0, first = 0; const missed = new Set();
  root.innerHTML = `<div class="sub">Items to sort <span class="pill" id="left">${items.length} left</span></div>
    <div class="pool" id="pool"></div>
    <div class="buckets">${FACTORS.map(f=>`<button class="bucket" data-f="${f.id}"><span class="bh">${f.e} Something you ${f.k.toLowerCase()}</span><span class="small muted">It ${f.short}</span><div class="placedlist"></div></button>`).join("")}</div>
    <div id="sfb" aria-live="polite"></div>`;
  const pool = root.querySelector("#pool"), fb = root.querySelector("#sfb"), left = root.querySelector("#left");
  items.forEach(it => {
    const c = el(`<button class="chip">${it.t}</button>`); c._it = it;
    c.addEventListener("click", () => {
      pool.querySelectorAll(".chip").forEach(x => x.classList.remove("sel"));
      c.classList.add("sel"); sel = c;
      fb.innerHTML = `<div class="feedback">Selected <b>${it.t}</b>. Now tap the factor box it belongs to.</div>`;
    });
    pool.appendChild(c);
  });
  root.querySelectorAll(".bucket").forEach(b => b.addEventListener("click", () => {
    if(!sel){ shake(b); fb.innerHTML = `<div class="feedback">First tap an item in the dashed box, then tap a factor.</div>`; return; }
    const it = sel._it;
    if(it.f === b.dataset.f){
      if(!missed.has(it.t)) first++;
      b.querySelector(".placedlist").appendChild(el(`<span class="placed">${it.t}</span>`));
      sel.remove(); sel = null; placed++;
      left.textContent = (items.length - placed) + " left";
      if(placed === items.length){
        pool.innerHTML = `<span class="muted">All sorted!</span>`;
        fb.innerHTML = `<div class="feedback good">🎉 All 12 sorted! Correct on the first try: <b>${first} of 12</b>.</div>`;
        api.complete();
      } else {

function analysePw(pw){
  const low = pw.toLowerCase();
  const pool = (/[a-z]/.test(pw)?26:0) + (/[A-Z]/.test(pw)?26:0) + (/\d/.test(pw)?10:0) + (/[^A-Za-z0-9]/.test(pw)?33:0);
  if(COMMON.includes(low)) return {common:true, word:null, pool, bits:0};
  const word = WORDS.find(w => low.includes(w)) || null;
  const effLen = Math.max(0, pw.length - (word ? word.length : 0));
  const bits = effLen * Math.log2(pool || 1) + (word ? Math.log2(10000) : 0);
  return {common:false, word, pool, bits};
}
function fmtTime(l){
  if(l < 0) return "less than a second";
  const s = Math.pow(10, l);
  if(s < 60) return Math.round(s) + " seconds";
  if(s < 3600) return Math.round(s/60) + " minutes";
  if(s < 86400) return Math.round(s/3600) + " hours";
  if(s < 31557600) return Math.round(s/86400) + " days";
  const y = l - Math.log10(31557600);
  if(y < 3) return Math.round(Math.pow(10,y)) + " years";
  if(y < 6) return Math.round(Math.pow(10,y-3)) + " thousand years";
  if(y < 9) return Math.round(Math.pow(10,y-6)) + " million years";
  if(y < 10.14) return Math.round(Math.pow(10,y-9)) + " billion years";
  return "longer than the age of the universe";
}

  const W=600, H=268, x0=40, x1=580, yb=212, yt=34, MI=35, MG=65, SD=10, PMAX=pdf(0,0,SD);

  const line = m => { let d=""; for(let s=0;s<=100;s+=1){ d += (s?"L":"M") + X(s).toFixed(1) + " " + Y(pdf(s,m,SD)).toFixed(1); } return d; };
  const area = (m,a,b) => { if(b<=a) return ""; let d = `M${X(a).toFixed(1)} ${yb}`; for(let s=a;s<=b;s+=0.5){ d += `L${X(s).toFixed(1)} ${Y(pdf(s,m,SD)).toFixed(1)}`; } return d + `L${X(b).toFixed(1)} ${yb}Z`; };
  let m1 = false, m2 = false;
  root.innerHTML = `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Two score curves, impostors and genuine users, with a movable threshold line">
      <path id="sImp" class="s-imp"/><path id="sGen" class="s-gen"/>
      <path class="c-imp" d="${line(MI)}"/><path class="c-gen" d="${line(MG)}"/>
      <line class="axis" x1="${x0}" y1="${yb}" x2="${x1}" y2="${yb}"/>
      <text class="lbl strong" x="${X(MI)}" y="${yt-12}" text-anchor="middle">Impostors</text>
      <text class="lbl strong" x="${X(MG)}" y="${yt-12}" text-anchor="middle">Genuine users</text>
      <text class="lbl" x="${x0}" y="${yb+20}">Low match score</text>
      <text class="lbl" x="${x1}" y="${yb+20}" text-anchor="end">High match score</text>
      <line id="thrL" class="thr" y1="${yt-4}" y2="${yb}"/>
      <text id="thrT" class="lbl strong" y="${yb+42}" text-anchor="middle"></text>
    </svg></div>
    <div class="field" style="margin-top:12px"><label for="rng">Threshold: <b id="tv"></b>. The system accepts if the match score is at or above it.</label><input type="range" min="10" max="90" step="1" value="40" id="rng"></div>
    <div class="stats">
      <div class="stat rate fm"><div class="k">False match rate</div><div class="v" id="fm"></div><div class="small muted">Impostors wrongly accepted (red area)</div></div>
      <div class="stat rate fnm"><div class="k">False non-match rate</div><div class="v" id="fnm"></div><div class="small muted">Genuine users wrongly rejected (amber area)</div></div>
    </div>
    <div class="tasks">
      <div class="task" id="m1"><span class="tick">✓</span>Mission 1, bank vault: get the false match rate below 1%</div>
      <div class="task" id="m2"><span class="tick">✓</span>Mission 2: find the Equal Error Rate, where both rates are within 1% of each other</div>
    </div>
    <div id="tfb" aria-live="polite"></div>`;
  const rng = root.querySelector("#rng"), fb = root.querySelector("#tfb");
  function update(){
    const t = +rng.value;
    root.querySelector("#sImp").setAttribute("d", area(MI, t, 100));
    root.querySelector("#sGen").setAttribute("d", area(MG, 0, t));
    const L = root.querySelector("#thrL"); L.setAttribute("x1", X(t)); L.setAttribute("x2", X(t));
    const T = root.querySelector("#thrT"); T.setAttribute("x", X(t)); T.textContent = "threshold " + t;
    root.querySelector("#tv").textContent = t;
    const fmr = (1 - Phi((t-MI)/SD))*100, fnmr = Phi((t-MG)/SD)*100;
    root.querySelector("#fm").textContent = fmr.toFixed(1) + "%";
    root.querySelector("#fnm").textContent = fnmr.toFixed(1) + "%";
    if(fmr < 1 && !m1){
      m1 = true; root.querySelector("#m1").classList.add("ok");
      fb.innerHTML = `<div class="feedback good"><b>Mission 1 complete!</b> Impostors almost never get in. But look: about <b>${fnmr.toFixed(0)}%</b> of genuine users are now rejected. That’s the price of high security.</div>`;
    }
    if(Math.abs(fmr - fnmr) < 1 && !m2){
      m2 = true; root.querySelector("#m2").classList.add("ok");
      fb.innerHTML = `<div class="feedback good"><b>Mission 2 complete!</b> At the Equal Error Rate both errors are about <b>${fmr.toFixed(1)}%</b>. Researchers use the EER to compare biometric systems: lower is better.</div>`;
    }
    if(m1 && m2) api.complete();
  }
  rng.addEventListener("input", update);
  update();
}

async function act_challenge(root, api){
  root.innerHTML = `<p class="muted">Setting up the server…</p>`;
  const P = "green7"; const hP = await sha256(P);
  let r1, r2, resp1, exp2;
  async function prep(){ r1 = rhex(8); r2 = rhex(8); resp1 = await sha256(r1 + hP); exp2 = await sha256(r2 + hP); }
  await prep();
  const sh = x => x.slice(0,12) + "…";
  let step = 0, simDone = false, mcqDone = false;
  root.innerHTML = `<div class="store small">🖥️ The server’s password file stores only <code>h(P) = ${sh(hP)}</code> for user <b>student</b>. The real password <code>${P}</code> is known only to the user.</div>
    <div class="seq-head"><div>💻 Client (you)</div><div>🖥️ University server</div></div>
    <div class="seq" id="seq"></div>
    <div class="row wrap" style="margin-top:12px"><button class="btn" id="nx">▶ Next step</button><button class="btn btn-ghost btn-sm" id="rs">↺ Restart</button></div>
    <div id="thr" hidden>
      <h4 class="part">Threats to remote authentication</h4>
      <div class="threats">
        <div><b>Client attack</b>Pretending to be the user at the login screen, for example by guessing.</div>
        <div><b>Host attack</b>Breaking into the server to steal stored passwords, token codes or biometric templates.</div>
        <div><b>Eavesdropping</b>Watching or listening to learn a password, including over someone’s shoulder.</div>
        <div><b>Replay</b>Resending a recorded login message, as Eve just tried.</div>
        <div><b>Trojan horse</b>A fake app, page or device that captures your password.</div>
        <div><b>Denial of service</b>Flooding the login system so real users can’t get in.</div>
      </div>
      <h4 class="part">Quick check</h4><div id="tq"></div>
    </div>`;
  const seq = root.querySelector("#seq"), nx = root.querySelector("#nx");
  const script = () => [
    {cls:"to-server", dir:"💻 Client ──▶ 🖥️ Server", pay:"ID = student", note:"Step 1: the client says who it claims to be (identification)."},
    {cls:"to-client", dir:"🖥️ Server ──▶ 💻 Client", pay:`Challenge: nonce r = ${r1}`, note:"Step 2: the server picks a fresh random <b>nonce</b>, a number used only once."},
    {cls:"calc", dir:"💻 Client calculates privately", pay:`h(P) = ${sh(hP)}<br>response = h(r + h(P)) = ${sh(resp1)}`, note:"Step 3: the client mixes the nonce with its hashed password."},
    {cls:"to-server", dir:"💻 Client ──▶ 🖥️ Server", pay:`Response = ${sh(resp1)}`, note:"Step 4: only this one-time response crosses the network, never the password."},
    {cls:"ok", dir:"🖥️ Server checks", pay:`expected = h(r + stored h(P)) = ${sh(resp1)} ✔ match`, note:"✅ Access granted! Now let’s see what an eavesdropper can do."},
    {cls:"calc eve", dir:"😈 Eve, listening on the Wi‑Fi", pay:`Recorded: Response = ${sh(resp1)}`, note:"Eve copied the response as it travelled over the network."},
    {cls:"to-server eve", dir:"😈 Eve ──▶ 🖥️ Server", pay:"ID = student", note:"Eve pretends to be the student."},
    {cls:"to-client", dir:"🖥️ Server ──▶ 😈 Eve", pay:`Challenge: NEW nonce r = ${r2}`, note:"A brand-new nonce, different from last time."},
    {cls:"to-server eve", dir:"😈 Eve ──▶ 🖥️ Server", pay:`Response = ${sh(resp1)} (old copy)`, note:"Eve doesn’t know the password, so she can’t calculate a new response. She replays the old one."},
    {cls:"bad", dir:"🖥️ Server checks", pay:`expected = h(${r2} + h(P)) = ${sh(exp2)} ✘ no match`, note:"⛔ Rejected! The old response only fitted the old nonce. Replay attack defeated."}
  ];
  function label(){
    if(step === 5) nx.innerHTML = "😈 Let Eve try a replay";
    else if(step >= 10) nx.innerHTML = "✓ Simulation finished";
    else nx.innerHTML = "▶ Next step";
    nx.disabled = step >= 10;
  }
  nx.addEventListener("click", () => {
    const s = script()[step]; if(!s) return;
    const m = el(`<div class="msg ${s.cls}"><div class="dir">${s.dir}</div><div class="pay">${s.pay}</div><div class="note">${s.note}</div></div>`);
    seq.appendChild(m);
    try{ m.scrollIntoView({block:"nearest", behavior: reduceMotion ? "auto" : "smooth"}); }catch(e){}
    step++; label();
    if(step >= 10 && !simDone){
      simDone = true; root.querySelector("#thr").hidden = false;
      choiceQuiz(root.querySelector("#tq"), {
        shuffle:true,
        hint:"Think about <b>what</b> the attacker is targeting: you, the server, the network, or the service itself.",
        items:[
          {q:"A fake university login page looks exactly like the real one and saves whatever password you type.", a:"Trojan horse", opts:["Trojan horse","Replay","Host attack","Denial of service"], why:"A Trojan horse pretends to be a genuine app, page or device in order to capture credentials."},
          {q:"An attacker floods the login server with millions of attempts, so real students can’t log in before the deadline.", a:"Denial of service", opts:["Denial of service","Client attack","Eavesdropping","Replay"], why:"Denial of service aims to disable the authentication service, not to steal anything."},
          {q:"An attacker breaks into the server and copies the file of stored password hashes.", a:"Host attack", opts:["Host attack","Client attack","Trojan horse","Replay"], why:"Host attacks target the stored file of passwords, token codes or biometric templates."},
          {q:"An attacker records your login message and sends the same message again later.", a:"Replay", opts:["Replay","Eavesdropping","Host attack","Denial of service"], why:"Exactly what Eve tried, and a fresh nonce defeats it."}
        ],
        onDone: () => { mcqDone = true; if(simDone) api.complete(); }
      });
    }
  });
  root.querySelector("#rs").addEventListener("click", async () => { await prep(); step = 0; seq.innerHTML = ""; label(); });
  label();
}

      concept:`<p>Biometric readings are never identical twice: your finger might be dry, or the light poor. So the system calculates a <b>matching score</b> and accepts you if the score is at or above a <b>threshold</b>.</p>
        <div class="two-col"><div class="mini"><div class="mini-h">🚨 False match</div>An <b>impostor is accepted</b> (also called false acceptance). Dangerous for security.</div>
        <div class="mini"><div class="mini-h">😤 False non-match</div>The <b>real user is rejected</b> (also called false rejection). Annoying for users.</div></div>
        <p>Raising the threshold makes false matches rarer but rejects real users more often. The point where both error rates are equal is the <b>Equal Error Rate (EER)</b>.</p>`,
      key:"Security vs convenience: you can’t push both errors to zero at the same time.",
      task:"Move the threshold slider to complete both missions.",
      hints:["To stop impostors, push the threshold to the right (stricter).","The EER is where the red and amber areas are the same size. Try the middle of the slider."],
      activity:act_threshold },
    { title:"Remote authentication: challenge–response",
      concept:`<p><b>Remote user authentication</b> happens over a network, the internet or Wi‑Fi, where attackers can listen. Sending your password as it is would be a gift to eavesdroppers, and even an encrypted password could be recorded and <b>replayed</b>.</p>
        <p>The fix is a <b>challenge–response protocol</b>. The server sends a fresh random number called a <b>nonce</b> (“number used once”). Your device combines it with your hashed password and sends back the result. Because the nonce changes every time, an old response is useless.</p>`,
      key:"The password never travels. Only a one-time response does.",
      task:"Step through a real login, then watch Eve the attacker try a replay. Finish with four quick threat questions.",
      hints:["Press “Next step” to move the protocol forward one message at a time.","Compare the nonce in Eve’s session with the one in the original session."],
      activity:act_challenge }
  ]
}
];

    <div id="qfb" aria-live="polite"></div>
    <div class="row end" style="margin-top:16px"><button class="btn" id="qsub" disabled>Submit answer</button></div>
  </section>`;
  const sub = document.getElementById("qsub"), btns = app.querySelectorAll(".qopt");
  btns.forEach(b => b.addEventListener("click", () => {
    if(locked) return;
    btns.forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel = +b.dataset.oi; sub.disabled = false;
  }));
  sub.addEventListener("click", () => {
    if(!locked){
      if(sel === null) return;
      locked = true;
      const ok = sel === q.a; if(ok) Q.score++;
      Q.answers.push({q: q.q, chosen: q.o[sel], correct: q.o[q.a], ok, ex: q.ex});
      btns.forEach(x => { x.disabled = true; const oi = +x.dataset.oi; if(oi === q.a) x.classList.add("right"); else if(oi === sel) x.classList.add("wrong"); x.classList.remove("sel"); });
      document.getElementById("qfb").innerHTML = `<div class="feedback ${ok?"good":"bad"}"><b>${ok ? "✅ Correct! +1 mark." : "❌ Not this time."}</b> ${q.ex}</div>`;
      sub.textContent = Q.i + 1 < Q.qs.length ? "Next question ▶" : "See my result 🎉";
    } else {
      if(Q.i + 1 < Q.qs.length){ Q.i++; go(screenQuestion); }
      else finishQuiz();
    }
  });
}

function finishQuiz(){
  const ms = Date.now() - Q.start;
  const r = { score:Q.score, total:15, pct:Math.round(Q.score/15*100), ms, date:new Date().toISOString(), attempt:S.results.length+1, activities:doneCount() };
  S.results.push(r); save();
  go(screenResult, r, Q.answers);
}

function screenResult(r, answers){
  mode = "result";
  const g = gradeOf(r.score), pass = r.score >= 9;
  const mins = Math.floor(r.ms/60000), secs = Math.round((r.ms%60000)/1000);
  const when = new Date(r.date).toLocaleString();
  const text = `User Authentication – Activity Result
Name: ${S.name}
Roll no.: ${S.roll}
Quiz score: ${r.score}/15 (${r.pct}%)
Grade: ${g.g} (${g.t}) – ${pass ? "PASS" : "Needs revision"}
Activities completed: ${r.activities}/15
Attempt: ${r.attempt}
Time taken: ${mins} min ${secs} s
Date: ${when}`;
  app.innerHTML = `<section class="screen stack">
    <div class="card cert">
      <div class="row between wrap"><span class="tag">🏆 Result card</span><span class="pill">Attempt ${r.attempt}</span></div>
      <h2 style="margin-top:12px">User Authentication: activity result</h2>
      <div class="result-grid">
        <div class="ring" style="--p:${r.pct}"><div><div><b>${r.score}</b><span>out of 15</span></div></div></div>
        <div class="kv">
          <div><small>Student</small><b>${esc(S.name)}</b></div>
          <div><small>Roll no.</small><b>${esc(S.roll)}</b></div>
          <div><small>Percentage</small><b>${r.pct}%</b></div>
          <div><small>Grade</small><b>${g.g} (${g.t})</b></div>
          <div><small>Status</small><b class="${pass?"status-pass":"status-fail"}">${pass ? "✅ Pass" : "📚 Needs revision"}</b></div>
          <div><small>Activities completed</small><b>${r.activities} of 15</b></div>
          <div><small>Time taken</small><b>${mins} min ${secs} s</b></div>
          <div><small>Date and time</small><b>${esc(when)}</b></div>
        </div>
      </div>
      <p class="small muted" style="margin-top:14px">📸 If your teacher asks for proof, take a screenshot of this card or copy the result text.</p>
      <div class="row wrap"><button class="btn" id="copy">📋 Copy result text</button><button class="btn btn-ghost" id="retake">🔁 Retake quiz</button><button class="btn btn-ghost" id="rmap">🗺️ Back to map</button></div>
      <div id="copyArea"></div>
    </div>
    <div class="card">
      <h3>Review your answers</h3>
      <ol class="review">${answers.map(a => `<li><b>${a.q}</b><br>
        <span class="${a.ok?"yes":"no"}">${a.ok ? "✓" : "✗"} Your answer: ${a.chosen}</span>
        ${a.ok ? "" : `<br><span class="yes">✓ Correct answer: ${a.correct}</span>`}
        <div class="small muted" style="margin-top:4px">${a.ex}</div></li>`).join("")}</ol>
    </div>
  </section>`;
  if(pass) confetti();
  const copyBtn = document.getElementById("copy");
  copyBtn.addEventListener("click", () => {
    const fallback = () => {
      const ca = document.getElementById("copyArea");
      ca.innerHTML = `<p class="small muted" style="margin-top:12px">Copying isn’t allowed here, so select the text below and copy it yourself.</p><textarea class="copybox" readonly></textarea>`;
      const ta = ca.querySelector("textarea"); ta.value = text; ta.focus(); ta.select();
    };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(() => { copyBtn.textContent = "✓ Copied"; setTimeout(() => copyBtn.textContent = "📋 Copy result text", 2000); }).catch(fallback);
      } else fallback();
    }catch(e){ fallback(); }
  });
  document.getElementById("retake").addEventListener("click", () => go(screenQuizIntro));
  document.getElementById("rmap").addEventListener("click", () => go(screenOverview));
}

/* ---------- Start ---------- */
load();
go(screenWelcome);
})();
</script>
</body>
</html>
